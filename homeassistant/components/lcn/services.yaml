dyn_text:
  fields:
    device_id:
      required: true
      example: "91aa039a2fb6e0b9f9ec7eb219a6b7d2"
      selector:
        text:
    row:
      required: true
      default: 1
      selector:
        number:
          mode: "box"
          min: 1
          max: 4
    text:
      required: true
      example: "text up to 60 characters"
      selector:
        text:

pck:
