# Describes the format for available LCN services

led:
  fields:
    device_id:
      required: true
      example: "91aa039a2fb6e0b9f9ec7eb219a6b7d2"
      selector:
        text:
    led:
      required: true
      default: "led1"
      selector:
        select:
          options:
            - "led1"
            - "led2"
            - "led3"
            - "led4"
            - "led5"
            - "led6"
            - "led7"
            - "led8"
            - "led9"
            - "led10"
            - "led11"
            - "led12"
    led_state:
      required: true
      default: "on"
      selector:
        select:
          options:
            - "on"
            - "off"
            - "blink"
            - "flicker"

var_abs:
  fields:
    device_id:
      required: true
      example: "91aa039a2fb6e0b9f9ec7eb219a6b7d2"
      selector:
        text:
    variable:
      required: true
      selector:
        select:
          options:
            - "r1var"
            - "r2var"
            - "r1varsetpoint"
            - "r2varsetpoint"
            - "tvar"
            - "var1ortvar"
            - "var2orr1var"
            - "var3orr2var"
            - "var1"
            - "var2"
            - "var3"
            - "var4"
            - "var5"
            - "var6"
            - "var7"
            - "var8"
            - "var9"
            - "var10"
            - "var11"
            - "var12"
    value:
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 100000
    unit_of_measurement:
      selector:
        select:
          options:
            - "%"
            - "°"
            - "°C"
            - "°F"
            - "ampere"
            - "amp"
            - "a"
            - "degree"
            - "native"
            - "k"
            - "lcn"
            - "lux_t"
            - "lx_t"
            - "lux_i"
            - "lux"
            - "lx"
            - "m/s"
            - "meterpersecond"
            - "percent"
            - "ppm"
            - "v"
            - "volt"

