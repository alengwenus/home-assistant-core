lock_regulator:
  fields:
    device_id:
      required: true
      example: "57a7ef91bc2537b72f99a95197a2e680"
      selector:
        text:
    setpoint:
      required: true
      selector:
        select:
          options:
            - "thrs1"
            - "thrs2"
            - "thrs3"
            - "thrs4"
            - "thrs5"
            - "thrs2_1"
            - "thrs2_2"
            - "thrs2_3"
            - "thrs2_4"
            - "thrs3_1"
            - "thrs3_2"
            - "thrs3_3"
            - "thrs3_4"
            - "thrs4_1"
            - "thrs4_2"
            - "thrs4_3"
            - "thrs4_4"
    lock_state:
      default: false
      selector:
        boolean:

send_key:
  fields:
    device_id:
      required: true
      example: "57a7ef91bc2537b72f99a95197a2e680"
      selector:
        text:
    key:
      required: true
      example: "a5"
      selector:
        text:
    key_state:
      default: hit
      selector:
        select:
          options:
            - "hit"
            - "make"
            - "break"
            - "dontsend"
    time:
      default: 0
      selector:
        number:
          min: 0
          max: 60
    time_unit:
      default: s
      selector:
        select:
          options:
            - "d"
            - "day"
            - "days"
            - "h"
            - "hour"
            - "hours"
            - "m"
            - "min"
            - "minute"
            - "minutes"
            - "s"
            - "sec"
            - "second"
            - "seconds"

lock_key:
  fields:
    device_id:
      required: true
      example: "57a7ef91bc2537b72f99a95197a2e680"
      selector:
        text:
    key:
      required: true
      example: "a5"
      selector:
        text:
    key_state:
      required: true
      example: "on"
      selector:
        select:
          options:
            - "on"
            - "off"
            - "toggle"
            - "nochange"
    time:
      default: 0
      selector:
        number:
          min: 0
          max: 60
    time_unit:
      default: s
      selector:
        select:
          options:
            - "d"
            - "day"
            - "days"
            - "h"
            - "hour"
            - "hours"
            - "m"
            - "min"
            - "minute"
            - "minutes"
            - "s"
            - "sec"
            - "second"
            - "seconds"

dyn_text:
  fields:
    device_id:
      required: true
      example: "57a7ef91bc2537b72f99a95197a2e680"
      selector:
        text:
    row:
      required: true
      selector:
        number:
          min: 1
          max: 4
    text:
      required: true
      example: "text up to 60 characters"
      selector:
        text:

pck:
  fields:
    device_id:
      required: true
      example: "57a7ef91bc2537b72f99a95197a2e680"
      selector:
        text:
    pck:
      required: true
      example: "PIN4"
      selector:
        text:
