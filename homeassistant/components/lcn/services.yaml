lock_regulator:
  fields:
    device_id:
      required: true
      example: "91aa039a2fb6e0b9f9ec7eb219a6b7d2"
      selector:
        text:
    setpoint:
      required: true
      default: "thrs1"
      selector:
        select:
          options:
            - "thrs1"
            - "thrs2"
            - "thrs3"
            - "thrs4"
            - "thrs5"
            - "thrs2_1"
            - "thrs2_2"
            - "thrs2_3"
            - "thrs2_4"
            - "thrs3_1"
            - "thrs3_2"
            - "thrs3_3"
            - "thrs3_4"
            - "thrs4_1"
            - "thrs4_2"
            - "thrs4_3"
            - "thrs4_4"
    lock_state:
      required: true
      selector:
        boolean:

send_key:
  fields:
    device_id:
      required: true
      example: "91aa039a2fb6e0b9f9ec7eb219a6b7d2"
      selector:
        text:
    key:
      required: true
      default: "a1"
      example: "a5"
      selector:
        select:
          options:
            - "a1"
            - "a2"
            - "a3"
            - "a4"
            - "a5"
            - "a6"
            - "a7"
            - "a8"
            - "b1"
            - "b2"
            - "b3"
            - "b4"
            - "b5"
            - "b6"
            - "b7"
            - "b8"
            - "c1"
            - "c2"
            - "c3"
            - "c4"
            - "c5"
            - "c6"
            - "c7"
            - "c8"
            - "d1"
            - "d2"
            - "d3"
            - "d4"
            - "d5"
            - "d6"
            - "d7"
            - "d8"
    key_state:
      required: true
      default: "hit"
      selector:
        select:
          translation_key: "key_state"
          options:
            - "hit"
            - "make"
            - "break"
    time:
      selector:
        number:
          min: 0
          max: 60
    time_unit:
      selector:
        select:
          options:
            - "days"
            - "hours"
            - "minutes"
            - "seconds"

lock_key:
  fields:
    device_id:
      required: true
      example: "91aa039a2fb6e0b9f9ec7eb219a6b7d2"
      selector:
        text:
    key:
      required: true
      default: "a1"
      example: "a5"
      selector:
        select:
          options:
            - "a1"
            - "a2"
            - "a3"
            - "a4"
            - "a5"
            - "a6"
            - "a7"
            - "a8"
            - "b1"
            - "b2"
            - "b3"
            - "b4"
            - "b5"
            - "b6"
            - "b7"
            - "b8"
            - "c1"
